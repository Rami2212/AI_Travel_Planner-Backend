server.port=8082
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/travel_planner
spring.datasource.username=travel_user
spring.datasource.password=travel_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=itinerary_service

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=itinerary
spring.kafka.consumer.auto-offset-reset=earliest

# Logging Configuration
logging.level.com.travelplanner.itinerary=INFO
logging.level.org.springframework.kafka=INFO

# Application Configuration
spring.application.name=itinerary